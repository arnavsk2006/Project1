<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DevOps Mini Project - DMCE</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f0f2f5;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .card {
            background: #ffffff;
            padding: 2.5rem;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            text-align: center;
            max-width: 500px;
        }
        h1 { color: #1a73e8; margin-bottom: 0.5rem; }
        p { color: #5f6368; font-size: 1.1rem; }
        .status {
            display: inline-block;
            background-color: #e6f4ea;
            color: #137333;
            padding: 8px 16px;
            border-radius: 20px;
            font-weight: bold;
            margin-top: 1rem;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>DevOps Pipeline Active!</h1>
        <p>Department of AI & DS — Datta Meghe College of Engineering</p>
        <div class="status">● Deployed via Github Actions & Docker</div>
    </div>
</body>
</html>
